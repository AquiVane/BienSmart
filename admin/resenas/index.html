<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Reseñas · Hábitos BienSmart (admin)</title>
<style>
:root{--m:#C2185B;--md:#880E4F;--rl:#FCE4EC;--rm:#F8BBD9;--ink:#3D1520;--mut:#8A5A6A;--bg:#FFF9FA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
h1{font:900 1.7rem Georgia,serif;margin:0 0 4px}h2{font-size:1.1rem;margin:28px 0 10px;color:var(--md)}
p{margin:0 0 10px}.mut{color:var(--mut)}
.card{background:#fff;border:1px solid var(--rm);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:700;font-size:.85rem;margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--rm);border-radius:12px;background:#fff;color:var(--ink)}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 18px;background:var(--m);color:#fff;cursor:pointer}
button.sec{background:var(--rl);color:var(--md)}button.mal{background:#fff;color:#B3261E;border:1.5px solid #F3B7B2}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:99px}
.pendiente{background:#FBEBC8;color:#9A6200}.aprobada{background:#DDF1E5;color:#1E7B4B}.rechazada{background:#FADAD6;color:#B3261E}
.stars{color:var(--m);letter-spacing:2px}
.q{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reseñas del reto</h1>
  <p class="mut">Herramienta para ocultar o eliminar una reseña si hiciera falta.</p>

  <div class="card" id="login">
    <label for="clave">Clave de administración</label>
    <input id="clave" type="password" autocomplete="current-password" placeholder="La misma del panel">
    <div class="row"><button id="entrar" type="button">Entrar</button></div>
    <p class="mut" id="lmsg" role="status" style="margin-top:8px"></p>
  </div>

  <div id="panel" hidden>
    <h2>Reseñas publicadas</h2>
    <p class="mut">Se publican solas cuando alguien que compró las escribe. Si alguna no corresponde, la podés ocultar o eliminar.</p>
    <div id="lista"></div>
  </div>
</div>
<script src="/assets/biensmart.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var KEY = '';
  try { KEY = sessionStorage.getItem('bs_admin') || ''; } catch (e) {}
  function api(path, method, body) {
    return fetch(BS.cfg.CORE + path, { method: method || 'GET', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': KEY }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, data: j }; }); })
      .catch(function () { return { ok: false, status: 0, data: { error: 'Sin conexión.' } }; });
  }
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function render(items) {
    var box = $('#lista'); box.textContent = '';
    if (!items.length) { box.appendChild(el('p', 'mut', 'Todavía no hay reseñas.')); return; }
    items.forEach(function (r) {
      var c = el('div', 'card');
      var h = el('div'); h.appendChild(el('span', 'tag ' + r.estado, r.estado)); h.appendChild(document.createTextNode(' '));
      h.appendChild(el('strong', '', r.nombre)); if (r.lugar) h.appendChild(el('span', 'mut', ' · ' + r.lugar));
      h.appendChild(document.createTextNode(' ')); h.appendChild(el('span', 'stars', '★'.repeat(r.estrellas || 5)));
      c.appendChild(h);
      if (r.email) c.appendChild(el('p', 'mut', r.email + ' · ' + (r.origen || '')));
      c.appendChild(el('p', 'q', r.texto));
      var row = el('div', 'row');
      function btn(t, cls, estado) { var b = el('button', cls, t); b.type = 'button'; b.addEventListener('click', function () {
        if (estado === 'eliminar' && !confirm('¿Eliminar esta reseña?')) return;
        b.disabled = true; api('/admin/bs/resenas/estado', 'POST', { id: r.id, estado: estado }).then(cargar); }); row.appendChild(b); }
      if (r.estado !== 'aprobada') btn('Volver a mostrar', '', 'aprobada');
      if (r.estado !== 'rechazada') btn('Ocultar', 'sec', 'rechazada');
      btn('Eliminar', 'mal', 'eliminar');
      c.appendChild(row); box.appendChild(c);
    });
  }
  function cargar() {
    return api('/admin/bs/resenas').then(function (r) {
      if (!r.ok) { $('#login').hidden = false; $('#panel').hidden = true; $('#lmsg').textContent = r.status === 401 ? 'La clave no es correcta.' : 'No pudimos cargar las reseñas.'; return; }
      $('#login').hidden = true; $('#panel').hidden = false; render(r.data.items || []);
    });
  }
  $('#entrar').addEventListener('click', function () { KEY = $('#clave').value.trim(); try { sessionStorage.setItem('bs_admin', KEY); } catch (e) {} cargar(); });
  if (KEY) cargar();
})();
</script>
</body>
</html>
